<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WellExpo 2026 — Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --navy-mid: #112240;
    --teal: #00b4a6;
    --gold: #c9a84c;
    --white: #f8f9fa;
    --muted: #8892a4;
    --border: rgba(255,255,255,0.08);
    --red: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Background glow */
  body::before {
    content: '';
    position: absolute;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,180,166,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: absolute;
    bottom: -200px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .login-card {
    background: var(--navy-mid);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 52px 48px;
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
  }

  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--teal), transparent);
    border-radius: 0 0 4px 4px;
  }

  .logo {
    text-align: center;
    margin-bottom: 36px;
  }

  .logo-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: var(--white);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .logo-title span { color: var(--gold); }

  .logo-sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--teal);
    margin: 16px auto;
    opacity: 0.5;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--teal);
    background: rgba(0,180,166,0.04);
  }

  input::placeholder { color: var(--muted); }

  .btn-login {
    width: 100%;
    padding: 15px;
    background: var(--teal);
    border: none;
    border-radius: 10px;
    color: var(--navy);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }

  .btn-login:hover {
    background: #00d4c4;
    transform: translateY(-1px);
  }

  .btn-login:active { transform: translateY(0); }

  .error-msg {
    display: none;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: var(--red);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 20px;
  }

  .error-msg.show { display: block; }

  .footer-text {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 28px;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-title">Well<span>Expo</span> 2026</div>
    <div class="logo-sub">Admin Portal</div>
    <div class="divider"></div>
  </div>

  <div class="error-msg" id="error-msg">
    Incorrect username or password. Please try again.
  </div>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username">
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
  </div>

  <button class="btn-login" onclick="login()">Sign In</button>

  <div class="footer-text">
    WellExpo 2026 · Kerala Healthcare Expo · Admin Access Only
  </div>
</div>

<script>
  // Check if already logged in
  if (sessionStorage.getItem('wellexpo_admin') === 'true') {
    window.location.href = '/admin.html';
  }

  function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (username === 'wellexpo2026' && password === 'Admin@2026') {
      sessionStorage.setItem('wellexpo_admin', 'true');
      window.location.href = '/admin.html';
    } else {
      document.getElementById('error-msg').classList.add('show');
      document.getElementById('password').value = '';
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
